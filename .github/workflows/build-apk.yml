name: Build Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

jobs:
  build:
    name: Build APK (No Secrets Required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build-tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run Core Tests and Assemble Debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :core:test :app:assembleDebug --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HGTV-android4-optimized
          path: android/app/build/outputs/apk/debug/app-debug.apk
